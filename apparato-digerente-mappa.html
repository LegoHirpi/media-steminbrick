<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'apparato digerente – Mappa progressiva | STEM in brick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --mint:#00e49a;
    --orange:#e8862a;
    --ink:#15181f;
    --blue:#7aa3e5;   --blue-d:#5a83c5;
    --red:#e68782;    --red-d:#c4635e;
    --orange-n:#f1925c; --orange-nd:#cf6f3a;
    --yellow:#ebd95f; --yellow-d:#c9b73e;
    --purple:#dd94e8; --purple-d:#b46fc0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:transparent;font-family:"Roboto Mono",ui-monospace,monospace;color:var(--mint)}
  #stars{position:fixed;inset:0;z-index:0;display:none}
  .stelle #stars,.stelle .glow{display:block}
  html.stelle,.stelle body{background:var(--bg)}
  .glow{display:none;position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 70% 45% at 30% 110%, rgba(0,228,154,.20), transparent 70%),
      radial-gradient(ellipse 60% 45% at 85% 105%, rgba(120,70,200,.25), transparent 70%);}

  /* ---------- header ---------- */
  header{position:fixed;top:0;left:0;right:0;z-index:5;padding:14px 18px;display:flex;align-items:center;gap:14px;
    pointer-events:none}
  .logo{font-weight:700;font-size:22px;line-height:1;letter-spacing:.5px}
  .logo .s{color:#f2c230}.logo .t{color:#e2453c}.logo .e{color:#2fb5e8}.logo .m{color:#53c24a}
  .logo small{display:block;font-size:12px;color:#fff;text-align:center;margin-top:2px}
  .code{font-size:clamp(14px,2.2vw,20px);color:var(--mint)}
  .code b{color:var(--orange);font-weight:700}

  /* ---------- viewport / world ---------- */
  #viewport{position:fixed;inset:0;z-index:1;cursor:grab;touch-action:none}
  #viewport.dragging{cursor:grabbing}
  #world{position:absolute;left:0;top:0;transform-origin:0 0}
  #world.anim{transition:transform .8s cubic-bezier(.45,.05,.25,1)}
  svg#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

  .node{position:absolute;padding:14px 16px 12px;border-radius:8px;color:var(--ink);font-size:15px;line-height:1.4;text-align:center;
    background:var(--c);box-shadow:0 5px 0 var(--cd), 0 10px 22px rgba(0,0,0,.55);
    opacity:0;transform:scale(.6) translateY(20px);transition:opacity .45s ease, transform .55s cubic-bezier(.3,1.6,.5,1);
    user-select:none}
  .node.shown{opacity:1;transform:none}
  .node.new{outline:3px solid #fff;outline-offset:4px;animation:pulse 1.6s ease-out 1}
  @keyframes pulse{0%{outline-color:#fff}100%{outline-color:transparent}}
  .node .studs{position:absolute;left:0;right:0;top:-8px;display:flex;justify-content:space-evenly;padding:0 10px;pointer-events:none}
  .node .studs i{display:block;width:22px;height:9px;border-radius:4px 4px 0 0;background:var(--c);box-shadow:inset 0 -2px 0 var(--cd), inset 0 2px 0 rgba(255,255,255,.35)}
  .node strong{font-weight:700}
  .node.list{line-height:1.55}
  .node.root{font-size:40px;font-weight:700;padding:18px 26px 14px}
  .node.big{font-size:24px;font-weight:600;line-height:1.25}
  .node.long{text-align:center;font-size:14px}
  .blue{--c:var(--blue);--cd:var(--blue-d)}
  .red{--c:var(--red);--cd:var(--red-d)}
  .orange{--c:var(--orange-n);--cd:var(--orange-nd)}
  .yellow{--c:var(--yellow);--cd:var(--yellow-d)}
  .purple{--c:var(--purple);--cd:var(--purple-d)}
  .node.root{font-size:32px;line-height:1.15}
  path.edge.brace{stroke-width:4}

  .zone{position:absolute;opacity:0;transition:opacity .6s ease;pointer-events:none}
  .zone.shown{opacity:1}
  .zone .lbl{position:absolute;left:50%;top:0;transform:translateX(-50%);white-space:nowrap;
    padding:6px 18px;border-radius:20px;font-weight:700;font-size:17px;color:var(--ink);background:var(--c)}
  .zone .bar{position:absolute;left:0;right:0;top:17px;height:18px;border:3px dashed var(--c);border-bottom:none;border-radius:10px 10px 0 0;opacity:.75}

  path.edge{fill:none;stroke-linecap:round;stroke-width:6;opacity:0;transition:opacity .2s}
  path.edge.shown{opacity:1}
  path.edge.def{stroke-width:5}
  path.edge.link{stroke-dasharray:4 12 !important;stroke-width:4}

  /* ---------- controls ---------- */
  .controls{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:8px;
    background:rgba(10,14,18,.85);border:2px solid #1f3b31;border-radius:14px;padding:8px 10px;backdrop-filter:blur(4px)}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;color:#04140e;background:var(--mint);
    font-weight:700;font-size:15px;height:44px;min-width:44px;padding:0 14px;box-shadow:0 4px 0 #00a26d;transition:transform .08s, box-shadow .08s, opacity .2s}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #00a26d}
  button:disabled{opacity:.35;cursor:default}
  button.sec{background:#26343b;color:var(--mint);box-shadow:0 4px 0 #111b20}
  button.arrow{font-size:22px;min-width:60px}
  .counter{min-width:72px;text-align:center;font-size:14px;color:#cfe}
  .progress{position:fixed;left:0;right:0;bottom:0;height:5px;z-index:6;background:#0b1712}
  .progress div{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--orange));transition:width .5s}
  .hint{position:fixed;right:16px;bottom:84px;z-index:4;font-size:12px;color:#7fbfa8;text-align:right;opacity:.8;pointer-events:none}
  @media (max-width:640px){
    .controls{gap:5px;padding:6px;bottom:12px}
    button{height:40px;font-size:13px;padding:0 10px}
    button.arrow{min-width:50px}
    .sec .lab{display:none}
    .hint{display:none}
    .counter{min-width:56px;font-size:12px}
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="glow"></div>

<header>
  <div class="logo"><span class="s">S</span><span class="t">T</span><span class="e">E</span><span class="m">M</span><small>in brick</small></div>
  <div class="code">$mappa = <b>"Apparato digerente"</b>;</div>
</header>

<div id="viewport">
  <div id="world">
    <svg id="edges"><defs id="defs"></defs></svg>
  </div>
</div>

<div class="hint">← → per avanzare · trascina per spostarti · rotellina per lo zoom</div>

<div class="controls">
  <button class="sec" id="restart" title="Ricomincia">⟲<span class="lab">&nbsp;Inizio</span></button>
  <button class="arrow" id="prev" title="Indietro">◀</button>
  <div class="counter" id="counter">1 / 1</div>
  <button class="arrow" id="next" title="Avanti">▶</button>
  <button class="sec" id="overview" title="Vedi tutta la mappa">⤢<span class="lab">&nbsp;Mappa</span></button>
  <button class="sec" id="fs" title="Schermo intero">⛶</button>
</div>
<div class="progress"><div id="bar"></div></div>

<script>
/* Sfondo trasparente di default; aggiungi ?stelle all'indirizzo per il cielo stellato */
if(/[?&]stelle/.test(location.search)) document.documentElement.classList.add('stelle');
/* =========================================================
   CONTENUTI DELLA MAPPA
   x, y = centro del riquadro; w = larghezza
   ========================================================= */
const NODES = [
  // colonne: sinistra (ghiandole) x=0 · centro (succhi) x=470 · destra (tratto) x=960 · parti dell'intestino x=1250
  {id:'root', x:480, y:0, w:320, c:'red', cls:'root', html:'Apparato digerente'},
  {id:'ghiandole', x:0, y:200, w:230, c:'red', cls:'big', html:'Ghiandole'},
  {id:'tratto', x:960, y:200, w:290, c:'blue', cls:'big', html:'Tratto digerente'},

  // cavo orale
  {id:'salivari', x:0, y:400, w:230, c:'red', html:'Ghiandole <strong>salivari</strong>'},
  {id:'saliva', x:470, y:400, w:200, c:'purple', cls:'big', html:'Saliva'},
  {id:'amilasi', x:470, below:'saliva', gap:45, w:340, c:'purple', cls:'long', html:'<strong>Amilasi</strong>: enzima che degrada i polisaccaridi'},
  {id:'cavo', x:960, y:400, w:190, c:'blue', html:'<strong>Cavo orale</strong>'},
  {id:'faringe', x:960, y:540, w:170, c:'blue', html:'<strong>Faringe</strong>'},
  {id:'epiglottide', x:960, y:660, w:190, c:'blue', html:'<strong>Epiglottide</strong>'},
  {id:'laringe', x:1250, y:660, w:150, c:'blue', html:'Laringe'},
  {id:'esofago', x:960, y:780, w:170, c:'blue', html:'<strong>Esofago</strong>'},
  {id:'cardias', x:960, y:900, w:170, c:'blue', html:'<strong>Cardias</strong>'},

  // stomaco
  {id:'gastriche', x:0, y:1040, w:230, c:'red', html:'Ghiandole <strong>gastriche</strong>'},
  {id:'gastrici', x:470, y:1040, w:220, c:'yellow', html:'<strong>Succhi gastrici</strong>'},
  {id:'gastriciD', x:470, below:'gastrici', gap:45, w:360, c:'yellow', cls:'long', html:'<strong>Acido cloridrico</strong>: battericida<br><br><strong>Pepsina</strong>: enzima che degrada le proteine in peptoni<br><br><strong>Muco</strong>: barriera che difende le pareti dello stomaco da acido cloridrico e pepsina'},
  {id:'stomaco', x:960, y:1040, w:170, c:'blue', html:'<strong>Stomaco</strong>'},
  {id:'piloro', x:960, y:1180, w:170, c:'blue', html:'<strong>Piloro</strong>'},
  {id:'intestino', x:960, y:1310, w:200, c:'blue', cls:'big', html:'Intestino'},

  // intestino tenue
  {id:'pancreatico', x:470, below:'gastriciD', gap:110, w:220, c:'orange', html:'<strong>Succo pancreatico</strong>'},
  {id:'pancreaticoD', x:470, below:'pancreatico', gap:45, w:360, c:'orange', cls:'long', html:'Enzimi che completano la digestione di proteine, grassi e zuccheri complessi'},
  {id:'bile', x:470, below:'pancreaticoD', gap:80, w:220, c:'orange', html:'<strong>Bile</strong>'},
  {id:'bileD', x:470, below:'bile', gap:45, w:360, c:'orange', cls:'long', html:'Elettroliti, fosfolipidi, colesterolo e bilirubina che collaborano ai processi della digestione (assorbimento dei grassi) e all\'eliminazione dall\'organismo di prodotti di scarto (bilirubina, colesterolo, sostanze tossiche e metaboliti di farmaci)'},
  {id:'enterico', x:470, below:'bileD', gap:80, w:220, c:'orange', html:'<strong>Succo enterico</strong>'},
  {id:'entericoD', x:470, below:'enterico', gap:45, w:360, c:'orange', cls:'long', html:'Enzimi necessari a completare la digestione degli alimenti, trasformando il <strong>chimo</strong> in <strong>chilo</strong>, pronto ad essere assorbito'},
  {id:'pancreas', x:0, alignY:'pancreatico', w:230, c:'red', html:'<strong>Pancreas</strong>'},
  {id:'fegato', x:0, alignY:'bile', w:230, c:'red', html:'<strong>Fegato</strong>'},
  {id:'duodenali', x:0, alignY:'enterico', w:230, c:'red', html:'Ghiandole <strong>duodenali</strong>'},
  {id:'tenue', x:960, alignY:'bile', w:220, c:'blue', cls:'big', html:'Intestino tenue'},
  {id:'digiuno', x:1250, alignY:'tenue', w:150, c:'blue', html:'Digiuno'},
  {id:'duodeno', x:1250, alignY:'digiuno', dy:-95, w:150, c:'blue', html:'Duodeno'},
  {id:'ileo', x:1250, alignY:'digiuno', dy:95, w:150, c:'blue', html:'Ileo'},

  // intestino crasso
  {id:'cieco', x:1250, alignY:'enterico', dy:180, w:150, c:'blue', html:'Cieco'},
  {id:'colon', x:1250, alignY:'cieco', dy:95, w:150, c:'blue', html:'Colon'},
  {id:'retto', x:1250, alignY:'colon', dy:95, w:150, c:'blue', html:'Retto'},
  {id:'ano', x:1250, alignY:'retto', dy:95, w:150, c:'blue', html:'Ano'},
  {id:'crasso', x:960, alignY:'colon', dy:47, w:220, c:'blue', cls:'big', html:'Intestino crasso'},
];

/* Collegamenti: [da, a, tipo, opzioni]
   tipo 'def'  = linea senza freccia (definizione, non un passaggio)
   tipo ''     = freccia
   opzioni: end:'top'  = la freccia entra dall'alto (off = spostamento orizzontale)
            end:'side' = parte dal basso ed entra di lato
            dy = sposta in verticale il punto d'arrivo
            c:'colore' = forza il colore della linea */
const EDGES = [
  ['root','tratto','def'], ['root','ghiandole','def'],
  ['intestino','tenue','def'],
  // tratto digerente
  ['tratto','cavo','def'],
  ['cavo','faringe'], ['faringe','epiglottide'],
  ['epiglottide','laringe','def'],
  ['epiglottide','esofago'], ['esofago','cardias'], ['cardias','stomaco'],
  ['stomaco','piloro'], ['piloro','intestino'],
  ['duodeno','digiuno'], ['digiuno','ileo'], ['ileo','cieco'],
  ['cieco','colon'], ['colon','retto'], ['retto','ano'],
  // ghiandole
  ['ghiandole','salivari','def'], ['salivari','gastriche','def'], ['gastriche','pancreas','def'],
  ['pancreas','fegato','def'], ['fegato','duodenali','def'],
  // succhi: ghiandola → succo → organo, e casella di descrizione sotto
  ['salivari','saliva'], ['saliva','cavo','',{c:'purple'}], ['saliva','amilasi','def'],
  ['gastriche','gastrici'], ['gastrici','stomaco','',{c:'yellow'}], ['gastrici','gastriciD','def'],
  ['pancreas','pancreatico'], ['pancreatico','tenue','',{c:'orange', dy:-14}], ['pancreatico','pancreaticoD','def'],
  ['fegato','bile'], ['bile','tenue','',{c:'orange'}], ['bile','bileD','def'],
  ['duodenali','enterico'], ['enterico','tenue','',{c:'orange', dy:14}], ['enterico','entericoD','def'],
];

/* Parentesi che raggruppano le parti dell'intestino */
const BRACES = [
  {label:'tenue', from:'duodeno', to:'ileo'},
  {label:'crasso', from:'cieco', to:'ano'},
];
const ZONES = [];

/* Sequenza dei passi: elementi che compaiono a ogni clic */
const STEPS = [
  ['root'],
  ['tratto','ghiandole'],
  ['cavo','salivari','saliva','amilasi'],
  ['faringe'],
  ['epiglottide'],
  ['laringe','esofago'],
  ['cardias'],
  ['stomaco','gastriche','gastrici','gastriciD'],
  ['piloro'],
  ['intestino'],
  ['tenue','duodeno','digiuno','ileo','pancreas','fegato','duodenali','pancreatico','pancreaticoD','bile','bileD','enterico','entericoD'],
  ['crasso','cieco','colon','retto','ano'],
];

/* =========================================================
   COSTRUZIONE
   ========================================================= */
const world = document.getElementById('world');
const svg = document.getElementById('edges');
const viewport = document.getElementById('viewport');
const els = {}, box = {}, parentOf = {};
const COLORS = {blue:'#7aa3e5', red:'#e68782', orange:'#f1925c', yellow:'#ebd95f', purple:'#dd94e8'};

NODES.forEach(n=>{
  const d = document.createElement('div');
  d.className = `node ${n.c} ${n.cls||''}`;
  d.style.width = n.w+'px';
  d.innerHTML = `<div class="studs">${'<i></i>'.repeat(Math.max(2,Math.floor(n.w/55)))}</div>${n.html}`;
  world.appendChild(d);
  els[n.id] = d;
});
ZONES.forEach(z=>{
  const d = document.createElement('div');
  d.className = `zone ${z.c}`;
  d.innerHTML = `<div class="bar"></div><div class="lbl">${z.label}</div>`;
  world.appendChild(d);
  els[z.id] = d;
});
EDGES.forEach(([a,b,t])=>{ if(t!=='link' && !parentOf[b]) parentOf[b] = a; });

function layout(){
  NODES.forEach(n=>{
    const d = els[n.id];
    const h = d.offsetHeight;
    let y = n.y;
    if (n.below) y = box[n.below].b + (n.gap||40) + h/2;          // sotto un'altra casella
    if (n.alignY) y = box[n.alignY].cy + (n.dy||0);                 // alla stessa altezza di un'altra
    const l = n.x - n.w/2, t = y - h/2;
    d.style.left = l+'px'; d.style.top = t+'px';
    box[n.id] = {l, t, r:l+n.w, b:t+h, cx:n.x, cy:y};
  });
  ZONES.forEach(z=>{
    const a = box[z.from], b = box[z.to], d = els[z.id];
    const l = a.l - 14, r = b.r + 14;
    d.style.left = l+'px'; d.style.top = (z.y-17)+'px'; d.style.width = (r-l)+'px'; d.style.height='60px';
    d.querySelector('.bar').style.borderColor = COLORS[z.c];
    box[z.id] = {l, r, t:z.y-17, b:z.y+40, cx:(l+r)/2, cy:z.y};
  });
  // edges
  svg.querySelectorAll('path.edge').forEach(p=>p.remove());
  const defs = document.getElementById('defs'); defs.innerHTML='';
  Object.entries(COLORS).forEach(([k,v])=>{
    defs.insertAdjacentHTML('beforeend',
      `<marker id="ar-${k}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${v}"/></marker>`);
  });
  EDGES.forEach(([a,b,t,o={}])=>{
    const A = box[a], B = box[b];
    const col = o.c || NODES.find(n=>n.id===(t==='link'?a:b)).c;
    const g = t==='def' ? 4 : 10; // distanza dal bordo
    const k = t==='def' ? 0 : 1; // spazio per la punta
    let d;
    const horiz = B.l > A.r - 5 || B.r < A.l + 5;
    if (o.end==='top'){
      const right = B.cx > A.cx;
      const x1 = right ? A.r+g : A.l-g, x2 = B.cx + (o.off||0), y2 = B.t-g-8*k;
      d = `M${x1},${A.cy} C${x2},${A.cy} ${x2},${A.cy} ${x2},${y2}`;
    } else if (o.end==='side'){
      const right = B.cx > A.cx;
      const x1 = A.cx + (o.off||0), y1 = A.b+g, x2 = right ? B.l-g-6*k : B.r+g+6*k;
      d = `M${x1},${y1} C${x1},${B.cy} ${x1},${B.cy} ${x2},${B.cy}`;
    } else if (t==='link'){
      // dal basso di A al lato destro di B
      const x1=A.cx, y1=A.b+g, x2=B.r+g+6, y2=B.cy;
      d = `M${x1},${y1} C${x1},${y2} ${x1},${y2} ${x2},${y2}`;
    } else if (horiz && Math.abs(B.cy - A.cy) < 40){
      const right = B.l > A.r - 5;
      const x1 = right? A.r+g : A.l-g, x2 = right? B.l-g-6*k : B.r+g+6*k;
      d = `M${x1},${A.cy} L${x2},${B.cy}`;
    } else if (horiz && t!=='def' && Math.abs((B.l > A.r - 5 ? B.l - A.r : A.l - B.r)) < 150){
      // poco spazio orizzontale e grande dislivello: linea a gomito
      // (scende in verticale, poi entra in orizzontale nel riquadro)
      const right = B.l > A.r - 5, down = B.cy > A.cy;
      const x0 = right ? Math.min(A.cx, B.l - 90) : Math.max(A.cx, B.r + 90);
      const y1 = down ? A.b + g : A.t - g;
      const x2 = right ? B.l - g - 6 : B.r + g + 6;
      const R = 30, sx = right ? 1 : -1, sy = down ? 1 : -1;
      d = `M${x0},${y1} L${x0},${B.cy - sy*R} Q${x0},${B.cy} ${x0 + sx*R},${B.cy} L${x2},${B.cy}`;
    } else if (horiz){
      const right = B.l > A.r - 5;
      const x1 = right? A.r+g : A.l-g, x2 = right? B.l-g-6*k : B.r+g+6*k;
      const mx = (x1+x2)/2, by = B.cy + (o.dy||0);
      d = `M${x1},${A.cy} C${mx},${A.cy} ${mx},${by} ${x2},${by}`;
    } else {
      const down = B.cy > A.cy;
      const y1 = down? A.b+g : A.t-g, y2 = down? B.t-g-8*k : B.b+g+8*k;
      const my = (y1+y2)/2;
      d = `M${A.cx},${y1} C${A.cx},${my} ${B.cx},${my} ${B.cx},${y2}`;
    }
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', d);
    p.setAttribute('class','edge'+(t?' '+t:''));
    p.setAttribute('stroke', COLORS[col]);
    if(t!=='def') p.setAttribute('marker-end', `url(#ar-${col})`);
    p.dataset.to = b; p.dataset.from = a;
    svg.appendChild(p);
  });
  // parentesi dei gruppi
  BRACES.forEach(br=>{
    const F = box[br.from], T = box[br.to], L = box[br.label];
    const left = L.cx < F.cx, sg = left ? -1 : 1;   // etichetta a sinistra o a destra del gruppo
    const gx = left ? Math.min(F.l, T.l) - 18 : Math.max(F.r, T.r) + 18, top = F.t + 4, bot = T.b - 4, my = (top+bot)/2;
    const lx = left ? L.r + 10 : L.l - 10;
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', `M${gx-10*sg},${top} Q${gx},${top} ${gx},${top+10} L${gx},${bot-10} Q${gx},${bot} ${gx-10*sg},${bot} M${gx},${my} L${lx},${L.cy}`);
    p.setAttribute('class','edge brace');
    p.setAttribute('stroke', COLORS[NODES.find(n=>n.id===br.label).c]);
    p.dataset.to = br.label; p.dataset.from = br.label;
    svg.appendChild(p);
  });
  applyStep(false);
}

/* =========================================================
   PASSI
   ========================================================= */
let step = 0;
const counter = document.getElementById('counter');
const bar = document.getElementById('bar');
const prevB = document.getElementById('prev'), nextB = document.getElementById('next');

function visibleSet(upTo){
  const s = new Set();
  for(let i=0;i<=upTo;i++) STEPS[i].forEach(id=>s.add(id));
  return s;
}
function applyStep(animate=true, focus=true){
  const vis = visibleSet(step);
  const fresh = new Set(STEPS[step]);
  Object.entries(els).forEach(([id,el])=>{
    el.classList.toggle('shown', vis.has(id));
    el.classList.remove('new');
  });
  if(animate) STEPS[step].forEach(id=>{ if(els[id].classList.contains('node')){ void els[id].offsetWidth; els[id].classList.add('new'); }});
  svg.querySelectorAll('path.edge').forEach(p=>{
    const show = vis.has(p.dataset.to) && vis.has(p.dataset.from);
    const isNew = show && (fresh.has(p.dataset.to) || fresh.has(p.dataset.from));
    const len = p.getTotalLength();
    p.style.transition='none';
    if(show && isNew && animate){
      p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
      p.classList.add('shown');
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        p.style.transition='stroke-dashoffset .7s ease, opacity .2s';
        p.style.strokeDashoffset = 0;
        setTimeout(()=>{ if(!p.classList.contains('link')) p.style.strokeDasharray='none'; else p.style.strokeDasharray=''; }, 750);
      }));
    } else {
      p.style.strokeDasharray = p.classList.contains('link') ? '' : 'none';
      p.style.strokeDashoffset = 0;
      p.classList.toggle('shown', show);
    }
  });
  counter.textContent = `${step+1} / ${STEPS.length}`;
  bar.style.width = ((step+1)/STEPS.length*100)+'%';
  prevB.disabled = step===0;
  nextB.disabled = step===STEPS.length-1;
  if(focus){
    // inquadra i nuovi elementi + il loro "genitore"
    const ids = [...STEPS[step]];
    if(STEPS[step].length <= 4) STEPS[step].forEach(id=>{ if(parentOf[id]) ids.push(parentOf[id]); });
    if(step===0) ids.push('reni');
    frame(ids.filter(id=>!id.startsWith('z')), animate, 1);
  }
}
function go(d){
  const n = Math.min(STEPS.length-1, Math.max(0, step+d));
  if(n===step) return;
  step = n; applyStep(d>0);
}

/* =========================================================
   CAMERA (pan / zoom)
   ========================================================= */
let cam = {x:0, y:0, s:1};
function setCam(c, animate){
  cam = c;
  world.classList.toggle('anim', !!animate);
  world.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.s})`;
}
function viewRect(){
  const top = 95, bottom = 90;
  return {w: innerWidth, h: innerHeight - top - bottom, top};
}
function frame(ids, animate=true, maxS=1.15){
  if(!ids.length) return;
  let l=Infinity,t=Infinity,r=-Infinity,b=-Infinity;
  ids.forEach(id=>{ const B=box[id]; if(!B) return; l=Math.min(l,B.l); t=Math.min(t,B.t); r=Math.max(r,B.r); b=Math.max(b,B.b); });
  const pad = 50, V = viewRect();
  const s = Math.min(maxS, (V.w-2*pad)/(r-l), (V.h-2*pad)/(b-t));
  setCam({s, x: V.w/2 - (l+r)/2*s, y: V.top + V.h/2 - (t+b)/2*s}, animate);
}
function overview(){
  const vis = [...visibleSet(step)];
  frame(vis, true, 1);
}

// trascinamento e pinch
const pointers = new Map(); let last = null, pinch0 = null;
viewport.addEventListener('pointerdown', e=>{
  if(e.target.closest('button')) return;
  viewport.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  viewport.classList.add('dragging'); world.classList.remove('anim');
  if(pointers.size===2){
    const [a,b] = [...pointers.values()];
    pinch0 = {d:Math.hypot(a.x-b.x,a.y-b.y), cam:{...cam}, mx:(a.x+b.x)/2, my:(a.y+b.y)/2};
  }
});
viewport.addEventListener('pointermove', e=>{
  if(!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===2 && pinch0){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x,a.y-b.y);
    zoomAt(pinch0.mx, pinch0.my, Math.max(.12, Math.min(2.5, pinch0.cam.s * d/pinch0.d)), pinch0.cam);
  } else if(pointers.size===1){
    setCam({...cam, x:cam.x + e.clientX-prev.x, y:cam.y + e.clientY-prev.y});
  }
});
function endPtr(e){ pointers.delete(e.pointerId); if(pointers.size<2) pinch0=null; if(!pointers.size) viewport.classList.remove('dragging'); }
viewport.addEventListener('pointerup', endPtr);
viewport.addEventListener('pointercancel', endPtr);
function zoomAt(px, py, ns, base=cam){
  const wx = (px - base.x)/base.s, wy = (py - base.y)/base.s;
  setCam({s:ns, x:px - wx*ns, y:py - wy*ns});
}
viewport.addEventListener('wheel', e=>{
  e.preventDefault(); world.classList.remove('anim');
  const f = Math.exp(-e.deltaY*0.0015);
  zoomAt(e.clientX, e.clientY, Math.max(.12, Math.min(2.5, cam.s*f)));
}, {passive:false});

/* =========================================================
   COMANDI
   ========================================================= */
nextB.onclick = ()=>go(1);
prevB.onclick = ()=>go(-1);
document.getElementById('restart').onclick = ()=>{ step=0; applyStep(true); };
document.getElementById('overview').onclick = overview;
document.getElementById('fs').onclick = ()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(()=>{});
};
addEventListener('keydown', e=>{
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){ e.preventDefault(); go(1); }
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); go(-1); }
  else if(e.key==='Home'){ step=0; applyStep(true); }
  else if(e.key==='End'){ step=STEPS.length-1; applyStep(false, false); overview(); }
  else if(e.key.toLowerCase()==='m'){ overview(); }
});
let rT; addEventListener('resize', ()=>{ clearTimeout(rT); rT=setTimeout(()=>{ drawStars(); applyStep(false); }, 150); });

/* =========================================================
   CIELO STELLATO
   ========================================================= */
const cv = document.getElementById('stars'), cx = cv.getContext('2d');
let stars = [];
function drawStars(){
  const dpr = devicePixelRatio||1;
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr;
  cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px';
  const n = Math.round(innerWidth*innerHeight/3500);
  stars = Array.from({length:n}, ()=>({x:Math.random()*cv.width, y:Math.random()*cv.height, r:(Math.random()<.9?1:2)*dpr, p:Math.random()*6.28, sp:.5+Math.random()*1.5}));
}
function tick(t){
  cx.clearRect(0,0,cv.width,cv.height);
  for(const s of stars){
    const a = .35 + .65*Math.abs(Math.sin(s.p + t/1000*s.sp*.6));
    cx.fillStyle = `rgba(255,255,255,${a})`;
    cx.fillRect(s.x, s.y, s.r, s.r);
  }
  requestAnimationFrame(tick);
}
drawStars(); requestAnimationFrame(tick);

/* avvio dopo il caricamento del font */
(document.fonts ? document.fonts.ready : Promise.resolve()).then(()=>{ layout(); applyStep(true); });
</script>
